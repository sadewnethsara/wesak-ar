<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Wesak AR Ground Placement</title>

  <!-- A-Frame FIRST -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- MindAR -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: black;
    }

    .ui {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 12px 20px;
      border-radius: 30px;
      font-size: 14px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

<div class="ui">
  📷 Scan the ground marker
</div>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <!-- ASSETS -->
  <a-assets>

    <!-- Your lotus model -->
    <a-asset-item id="lotusModel" src="./assets/lotus.glb"></a-asset-item>

    <!-- Your lantern model -->
    <a-asset-item id="lanternModel" src="./assets/lantern.glb"></a-asset-item>

  </a-assets>

  <!-- CAMERA -->
  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <!-- TARGET -->
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- GROUND BASE -->
    <a-circle
      rotation="-90 0 0"
      radius="1"
      color="#222222"
      opacity="0.3"
    ></a-circle>

    <!-- LOTUS MODEL ON GROUND -->
    <a-gltf-model
      src="#lotusModel"
      position="0 0 0"
      rotation="0 0 0"
      scale="0.05 0.05 0.05"
    ></a-gltf-model>

    <!-- FLOATING LANTERNS -->
    <!-- 1.8 = around 6 feet -->

    <a-gltf-model
      src="#lanternModel"
      position="0 1.8 0"
      scale="0.2 0.2 0.2"
      animation="
        property: position;
        from: 0 1.7 0;
        to: 0 1.9 0;
        dir: alternate;
        loop: true;
        dur: 2500;
      "
    ></a-gltf-model>

    <!-- EXTRA LANTERNS -->

    <a-gltf-model
      src="#lanternModel"
      position="-0.8 1.7 0"
      scale="0.15 0.15 0.15"
      animation="
        property: position;
        from: -0.8 1.6 0;
        to: -0.8 1.8 0;
        dir: alternate;
        loop: true;
        dur: 3000;
      "
    ></a-gltf-model>

    <a-gltf-model
      src="#lanternModel"
      position="0.8 1.9 0"
      scale="0.15 0.15 0.15"
      animation="
        property: position;
        from: 0.8 1.8 0;
        to: 0.8 2 0;
        dir: alternate;
        loop: true;
        dur: 2800;
      "
    ></a-gltf-model>

    <!-- LIGHTS -->

    <a-light
      type="point"
      color="#FFD700"
      intensity="2"
      distance="10"
      position="0 2 1"
    ></a-light>

    <a-light
      type="ambient"
      color="#ffffff"
      intensity="0.6"
    ></a-light>

  </a-entity>

</a-scene>

</body>
</html>
